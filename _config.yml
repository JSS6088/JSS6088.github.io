title: Portfolio
description: A showcase of my tech art and rendering projects
theme: null

# Plugins (GitHub Pages defaults, safe to include)
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Optional: to show up on GitHub
show_downloads: false

# kramdown
markdown: kramdown
kramdown:
  parse_block_html: true

# Custom navigation links
navigation:
  - name: Home
    link: /
  - name: Games
    link: /games.html
  - name: Tools
    link: /tools.html
  - name: Shaders
    link: /shaders.html
  - name: Studies
    link: /studies.html

# Keep raw capture sources out of the build. Web encodes live in assets/videos/.
# NOTE: setting `exclude` overrides Jekyll's defaults, so they are repeated here.
exclude:
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - "assets/images/**/*.mp4"
  - "assets/images/**/*.tga"
  - "assets/images/**/*.TGA"
  - "assets/HeroShots"
  - "assets/autostroke-heroshots"
