title: Portfolio
description: A showcase of my tech art and rendering projects
theme: null

# Plugins (GitHub Pages defaults, safe to include)
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Optional: to show up on GitHub
show_downloads: false

# kramdown
markdown: kramdown
kramdown:
  parse_block_html: true

# Custom navigation links
navigation:
  - name: Home
    link: /
  - name: Tech Art
    link: /tech-art.html
  - name: Computer Graphics
    link: /computer-graphics.html
  - name: 3D Art
    link: /3d-art.html

# Keep raw capture sources out of the build. Web encodes live in assets/videos/.
# NOTE: setting `exclude` overrides Jekyll's defaults, so they are repeated here.
exclude:
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - "assets/images/**/*.mp4"
  - "assets/images/**/*.tga"
  - "assets/images/**/*.TGA"
